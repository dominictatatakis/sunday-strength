name: SundayStrength
options:
  bundleIdPrefix: com.sundaystrength
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # Ad-hoc signing, the simulator default. Signing cannot be switched off
    # entirely: an unsigned bundle has no keychain access group, so every
    # SecItemAdd fails with errSecMissingEntitlement (-34018).
    # Debug only -- Release must sign for real or the App Store export fails.
    Debug:
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "NO"
targets:
  SundayStrength:
    type: application
    platform: iOS
    sources:
      - path: SundayStrength
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundaystrength.app
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: SundayStrength/Info.plist
    info:
      path: SundayStrength/Info.plist
      properties:
        CFBundleDisplayName: Sunday Strength
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No encryption beyond HTTPS/Keychain, which is exempt. Declaring it
        # here avoids the export-compliance prompt on every single upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  SundayStrengthTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    resources:
      - path: Tests/Fixtures
    dependencies:
      - target: SundayStrength
    settings:
      base:
        # Run hosted inside the app. A standalone test bundle has no app
        # identity and therefore no keychain, which fails SecItemAdd with
        # errSecMissingEntitlement (-34018).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SundayStrength.app/SundayStrength"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Signing the bundle requires one; the app target supplies its own.
        GENERATE_INFOPLIST_FILE: "YES"
  SundayStrengthUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SundayStrength
    settings:
      base:
        TEST_TARGET_NAME: SundayStrength
        GENERATE_INFOPLIST_FILE: "YES"
